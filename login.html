<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ARY'S CAFE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brown: #352116;
            --dark-brown: #24150e;
            --gold: #a37b3f;
            --light-gold: #d8c39b;
            --cream: #f7f4ec;
            --white: #ffffff;
            --text: #30231c;
            --muted: #747474;
            --border: #e4ded3;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        /* =========================
           HEADER
        ========================= */

        .top-header {
            height: 120px;
            background: #fffdfa;
            border-bottom: 1px solid #e9e3d8;
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: min(1280px, calc(100% - 80px));
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            color: var(--brown);
        }

        .brand-logo {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 30px;
            letter-spacing: 1px;
            color: #2d1d15;
        }

        .brand-cafe {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--gold);
        }

        .header-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-link {
            text-decoration: none;
            color: var(--brown);
            font-size: 16px;
            padding: 18px 28px;
            transition: 0.25s ease;
        }

        .header-link:hover {
            color: var(--gold);
        }

        .header-home {
            background: var(--brown);
            color: white;
            min-width: 160px;
            text-align: center;
            font-weight: 600;
        }

        .header-home:hover {
            background: #4a2d1e;
            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .login-section {
            min-height: calc(100vh - 120px);
            padding: 56px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 35%,
                    rgba(255,255,255,0.9) 0%,
                    rgba(247,244,236,0.85) 45%,
                    rgba(238,233,222,0.9) 100%);
        }

        .login-card {
            width: min(1180px, 100%);
            min-height: 690px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow:
                0 24px 60px rgba(52, 34, 22, 0.14),
                0 5px 18px rgba(52, 34, 22, 0.06);
        }

        /* =========================
           LEFT BRAND PANEL
        ========================= */

        .brand-panel {
            background:
                radial-gradient(
                    circle at center,
                    #40281a 0%,
                    #2d1b11 58%,
                    #21130d 100%
                );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: rgba(180, 135, 67, 0.06);
            filter: blur(5px);
        }

        .brand-image {
            width: 100%;
            max-width: 510px;
            height: auto;
            position: relative;
            z-index: 2;
            display: block;
            mix-blend-mode: screen;
            filter:
                brightness(0.88)
                contrast(1.15)
                saturate(0.9);
        }

        /* =========================
           RIGHT FORM PANEL
        ========================= */

        .form-panel {
            background: #fff;
            padding: 70px 72px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 6px;
            margin-bottom: 22px;
        }

        .form-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 52px;
            font-weight: 400;
            line-height: 1.05;
            color: #291a13;
            margin-bottom: 18px;
        }

        .form-subtitle {
            font-size: 18px;
            line-height: 1.6;
            color: #6e7279;
            margin-bottom: 42px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .form-label {
            font-size: 16px;
            font-weight: 700;
            color: #30231c;
        }

        .forgot-link {
            color: #98682f;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        .forgot-link:hover {
            color: #5c3a20;
        }

        .form-input {
            width: 100%;
            height: 62px;
            border: 1px solid var(--border);
            background: #fcfbf8;
            padding: 0 18px;
            font-size: 16px;
            color: var(--text);
            outline: none;
            border-radius: 2px;
            transition: 0.2s ease;
        }

        .form-input::placeholder {
            color: #85888e;
        }

        .form-input:focus {
            border-color: var(--gold);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(163, 123, 63, 0.08);
        }

        .login-button {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 3px;
            background: var(--brown);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: 0.25s ease;
        }

        .login-button:hover {
            background: #4a2d1e;
            transform: translateY(-1px);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #e5dfd6;
            margin: 26px 0;
        }

        .create-text {
            text-align: center;
            font-size: 16px;
            color: #72757a;
        }

        .create-link {
            color: #98682f;
            text-decoration: none;
            font-weight: 700;
        }

        .create-link:hover {
            color: #5c3a20;
        }

        .back-link {
            margin-top: 26px;
            color: #34251d;
            text-decoration: none;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
        }

        .back-link:hover {
            color: var(--gold);
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;
            margin-bottom: 20px;
            padding: 13px 15px;
            border-radius: 3px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f8e9e5;
            color: #8b3025;
            border: 1px solid #e6c8c2;
        }

        .message.success {
            background: #edf5ed;
            color: #356338;
            border: 1px solid #cbdcca;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 950px) {

            .top-header {
                height: 95px;
            }

            .header-inner {
                width: calc(100% - 40px);
            }

            .brand-logo {
                width: 62px;
                height: 62px;
            }

            .brand-name {
                font-size: 24px;
            }

            .brand-cafe {
                font-size: 11px;
                letter-spacing: 4px;
            }

            .header-link {
                padding: 14px 18px;
            }

            .login-section {
                min-height: calc(100vh - 95px);
                padding: 35px 20px;
            }

            .login-card {
                grid-template-columns: 1fr;
                max-width: 650px;
            }

            .brand-panel {
                min-height: 390px;
                padding: 35px;
            }

            .brand-image {
                max-width: 390px;
            }

            .form-panel {
                padding: 50px 45px;
            }
        }

        @media (max-width: 600px) {

            .top-header {
                height: auto;
                padding: 15px 0;
            }

            .header-inner {
                width: calc(100% - 30px);
            }

            .brand {
                gap: 10px;
            }

            .brand-logo {
                width: 52px;
                height: 52px;
            }

            .brand-name {
                font-size: 20px;
            }

            .brand-cafe {
                font-size: 9px;
                letter-spacing: 3px;
                margin-top: 5px;
            }

            .header-links {
                gap: 0;
            }

            .header-link {
                padding: 11px 10px;
                font-size: 14px;
            }

            .header-home {
                min-width: auto;
            }

            .login-section {
                padding: 20px 12px;
            }

            .login-card {
                border-radius: 8px;
            }

            .brand-panel {
                min-height: 280px;
                padding: 25px;
            }

            .brand-image {
                max-width: 280px;
            }

            .form-panel {
                padding: 38px 25px;
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 4px;
            }

            .form-title {
                font-size: 40px;
            }

            .form-subtitle {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .form-input,
            .login-button {
                height: 56px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">
        <div class="header-inner">

            <a href="index.html" class="brand">
                <img
                    src="./arys-cafe-logo.png"
                    alt="ARY'S CAFE"
                    class="brand-logo"
                >

                <div class="brand-text">
                    <span class="brand-name">ARY'S</span>
                    <span class="brand-cafe">CAFE</span>
                </div>
            </a>

            <nav class="header-links">
                <a href="index.html" class="header-link">
                    Home
                </a>

                <a href="register.html" class="header-link header-home">
                    Create Account
                </a>
            </nav>

        </div>
    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main class="login-section">

        <div class="login-card">

            <!-- LEFT SIDE -->

            <section class="brand-panel">

                <img
                    src="./arys-cafe-logo.png"
                    alt="ARY'S CAFE Logo"
                    class="brand-image"
                >

            </section>


            <!-- RIGHT SIDE -->

            <section class="form-panel">

                <div class="eyebrow">
                    WELCOME BACK
                </div>

                <h1 class="form-title">
                    Login
                </h1>

                <p class="form-subtitle">
                    Sign in to continue to your ARY'S CAFE account.
                </p>


                <div id="message" class="message"></div>


                <form id="loginForm">

                    <!-- EMAIL -->

                    <div class="form-group">

                        <div class="form-label-row">
                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>
                        </div>

                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <div class="form-label-row">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <a
                                href="#"
                                class="forgot-link"
                                id="forgotPassword"
                            >
                                Forgot password?
                            </a>

                        </div>

                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>

                </form>


                <div class="divider"></div>


                <p class="create-text">
                    Don't have an account?
                    <a
                        href="register.html"
                        class="create-link"
                    >
                        Create Account
                    </a>
                </p>


                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to ARY'S CAFE
                </a>

            </section>

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const forgotPassword = document.getElementById("forgotPassword");


        function showMessage(text, type) {

            message.textContent = text;

            message.className = "message show " + type;
        }


        /* LOGIN */

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            /* ADMIN LOGIN */

            if (
                email === "admin@aryscafe.com" &&
                password === "admin123"
            ) {

                localStorage.setItem(
                    "arysCafeLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "arysCafeRole",
                    "admin"
                );

                localStorage.setItem(
                    "arysCafeUser",
                    JSON.stringify({
                        name: "Admin",
                        email: email,
                        role: "admin"
                    })
                );

                window.location.href = "admin.html";

                return;
            }


            /* KITCHEN LOGIN */

            if (
                email === "kitchen@aryscafe.com" &&
                password === "kitchen123"
            ) {

                localStorage.setItem(
                    "arysCafeLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "arysCafeRole",
                    "kitchen"
                );

                localStorage.setItem(
                    "arysCafeUser",
                    JSON.stringify({
                        name: "Kitchen Staff",
                        email: email,
                        role: "kitchen"
                    })
                );

                window.location.href = "kitchen.html";

                return;
            }


            /* REGISTERED CUSTOMER */

            const savedUser =
                localStorage.getItem("arysCafeUser");

            if (savedUser) {

                try {

                    const user =
                        JSON.parse(savedUser);

                    if (
                        user.email &&
                        user.email.toLowerCase() ===
                        email.toLowerCase()
                    ) {

                        if (user.password === password) {

                            localStorage.setItem(
                                "arysCafeLoggedIn",
                                "true"
                            );

                            localStorage.setItem(
                                "arysCafeRole",
                                "customer"
                            );

                            window.location.href =
                                "menu.html";

                            return;

                        } else {

                            showMessage(
                                "Incorrect password. Please try again.",
                                "error"
                            );

                            return;
                        }
                    }

                } catch (error) {

                    console.log(error);

                }
            }


            showMessage(
                "Account not found. Please check your email and password or create a new account.",
                "error"
            );

        });


        /* FORGOT PASSWORD */

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                showMessage(
                    "Password recovery will be connected with the backend.",
                    "success"
                );

            }
        );

    </script>

</body>
</html>
